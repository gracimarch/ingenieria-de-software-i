<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Iniciá sesión para acceder a tu cuenta y gestionar tus actividades.">
    <title>Inicio de Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-wrapper">

        <!-- Panel izquierdo decorativo -->
        <div class="login-panel-left" aria-hidden="true">
            <div class="panel-content">
                <div class="panel-logo">✦</div>
                <div class="panel-text">
                    <p class="panel-tagline">Bienvenido de vuelta</p>
                    <h2 class="panel-headline">Administrá tus datos de forma simple</h2>
                </div>
            </div>
        </div>

        <!-- Panel derecho: formulario -->
        <div class="login-panel-right">
            <div class="form-container">

                <div class="form-header">
                    <span class="form-logo" aria-hidden="true">✦</span>
                    <h1 class="form-title">Iniciar sesión</h1>
                    <p class="form-subtitle">Ingresá tus datos para continuar</p>
                </div>

                <form id="login-form" novalidate>

                    <div class="field-group">
                        <div class="input-wrapper">
                            <input class="field-input" type="text" id="username" name="username"
                                placeholder="Usuario" autocomplete="username" required>
                        </div>
                    </div>

                    <div class="field-group">
                        <div class="input-wrapper">
                            <input class="field-input" type="password" id="password" name="password"
                                placeholder="Contraseña" autocomplete="current-password" required>
                            <button type="button" class="toggle-password" id="toggle-password"
                                aria-label="Mostrar contraseña" aria-pressed="false">
                                <svg class="eye-icon eye-show" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path
                                        d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg class="eye-icon eye-hide" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path
                                        d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" />
                                    <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
                                    <path
                                        d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" />
                                    <path d="m2 2 20 20" />
                                </svg>
                            </button>
                        </div>
                        <a class="link-secondary" href="#">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button class="btn-primary" type="submit" id="submit">
                        Iniciar sesión
                    </button>

                </form>

                <div class="divider">
                    <span class="divider-line"></span>
                    <span class="divider-text">o</span>
                    <span class="divider-line"></span>
                </div>

                <p class="form-footer-text">
                    ¿No tenés cuenta? <a class="link-accent" href="signup.html">Registrate</a>
                </p>

            </div>
        </div>

    </div>

    <script src="js/login.js"></script>
</body>

</html>
